name: Generate Summary Report

on:
  push:
    paths:
      - "data/combined_results.csv"
      - "data/combined_results.json"
  pull_request:
    paths:
      - "data/combined_results.csv"
      - "data/combined_results.json"
  workflow_dispatch:

permissions:
  contents: write 
jobs:
  build-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas tabulate matplotlib

      - name: Generate summary report
        run: python training/scripts/generate_summary.py

      - name: Commit and push summary report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/summary_report.md
          git diff --quiet && echo "No changes to commit." || (
            git commit -m "Auto-update summary report"
            git push
          )
