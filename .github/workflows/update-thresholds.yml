name: Update Empirical Thresholds
on:
  push:
    paths:
      - "data/combined_results.csv"
      - "data/combined_results.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-summary:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy json pathlib

      - name: Generate summary report
        run: python training/scripts/compute_threshold.py

      - name: Commit & Push summary
        uses: actions-js/push@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          message: "Auto-update reference thresholds [skip ci]"
          directory: .
