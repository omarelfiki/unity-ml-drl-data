name: Sync Data to Shared Repository

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout team training repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify combined_results.csv exists
        run: |
          if [ ! -f "data/combined_results.csv" ]; then
            echo "No combined_results.csv found. Exiting."
            exit 1
          fi
          echo "Found data/combined_results.csv"

      - name: Clone the shared dataset fork
        run: |
          git clone "https://github.com/Ashour777/BCS2720-project-data-collection-2025-2026.git" shared_repo
          cd shared_repo
          git remote add upstream "https://github.com/DennisSoemers/BCS2720-project-data-collection-2025-2026.git"
          git fetch upstream
          git checkout main
          git pull upstream main

      - name: Copy updated results to Group 6
        run: |
          cp "data/combined_results.csv" "shared_repo/Group 6/combined_results.csv"
          echo "Copied combined_results.csv to Group 6 folder."

      - name: Commit and push updated results to fork
        uses: actions-js/push@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          message: "Auto-update: Group 6 combined_results.csv"
          directory: ./shared_repo