name: Data Preprocessing
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pathlib

      - name: Run snapshot script
        run: python data/workflows/csv_snapshot.py

      - name: Run normalization script
        run: python data/workflows/normalize_data.py

      - name: Commit & push all updates
        uses: actions-js/push@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          message: "Auto-create Normalized CSV snapshot [skip ci]"
          directory: .

